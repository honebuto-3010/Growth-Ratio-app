<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>割合計算 — Growth & Ratio</title>
    <link rel="stylesheet" href="css/calc.css">
</head>
<body>

<section class="calc-page">

    <h1 class="calc-title">割合計算</h1>

    <div class="calc-form">

        <label>値A</label>
        <input type="number" id="valueA">

        <label>値B</label>
        <input type="number" id="valueB">

        <button id="calcBtn">計算する</button>
        <button id="resetBtn" class="reset-button">リセット</button>
        <div class="result" id="result"></div>

        <button class="back-home">Home に戻る</button>
        <button class="back-menu">Menu に戻る</button>


    </div>

</section>
<footer class="app-footer">

    <div class="footer-logo">
        <div class="footer-logo-main">Growth & Ratio</div>
        <div class="footer-logo-sub">since 2026</div>
    </div>

    <p class="footer-tagline">
        Simple and beautiful calculation utilities.<br>
        Designed for clarity and ease.
    </p>

    <p class="footer-copy">
        © Growth & Ratio — since 2026
    </p>

</footer>
<script src="js/calc-proportion.js"></script>
<script>
document.querySelector(".back-home").addEventListener("click", () => {
    window.location.href = "index.html";
});
</script>
<script>
document.querySelector(".back-menu").addEventListener("click", () => {
    window.location.href = "menu.html";
});
</script>

</html>

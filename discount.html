<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>割引計算 — Growth & Ratio</title>
    <link rel="stylesheet" href="css/calc.css">
</head>
<body>

<section class="calc-page">

    <h1 class="calc-title">割引計算</h1>

    <button class="back-home">Home に戻る</button>
    <button class="back-menu">Menu に戻る</button>


    <div class="calc-form">

        <label>元の価格</label>
        <input type="number" id="originalPrice">

        <label>割引率（%）</label>
        <input type="number" id="discountRate">

        <button id="calcBtn">計算する</button>
        <button id="resetBtn" class="reset-button">リセット</button>


    </div>

    <div class="result" id="result"></div>

</section>

<script src="js/calc-discount.js"></script>
<script>
document.querySelector(".back-home").addEventListener("click", () => {
    window.location.href = "index.html";
});
</script>
<script>
document.querySelector(".back-menu").addEventListener("click", () => {
    window.location.href = "menu.html";
});
</script>

</body>
</html>
